<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#2C3E50"/>
  <!-- 地面 -->
  <rect x="0" y="48" width="64" height="16" fill="#8B4513"/>
  <rect x="0" y="46" width="64" height="4" fill="#27AE60"/>
  <!-- 身体 -->
  <rect x="22" y="20" width="16" height="18" rx="2" fill="#E74C3C"/>
  <!-- 头 -->
  <circle cx="30" cy="14" r="7" fill="#FDCB6E"/>
  <!-- 眼睛 -->
  <rect x="32" y="12" width="3" height="3" fill="#2C3E50"/>
  <!-- 胳膊（摆动） -->
  <rect x="16" y="22" width="6" height="4" fill="#E74C3C" transform="rotate(-20 19 24)"/>
  <rect x="38" y="26" width="6" height="4" fill="#E74C3C" transform="rotate(20 41 28)"/>
  <!-- 腿（跑步姿态） -->
  <rect x="23" y="38" width="5" height="10" fill="#2C3E50" transform="rotate(-15 25 43)"/>
  <rect x="32" y="38" width="5" height="10" fill="#2C3E50" transform="rotate(15 34 43)"/>
  <!-- 运动线 -->
  <line x1="8" y1="30" x2="16" y2="30" stroke="#ECF0F1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="4" y1="36" x2="12" y2="36" stroke="#ECF0F1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
